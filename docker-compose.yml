# Sân 7: cùng một file chạy trên Windows (Docker Desktop) và VPS.
# Mọi cấu hình đọc từ .env (chép từ .env.example).
name: san7

x-backend-env: &backend-env
  NODE_ENV: ${NODE_ENV:-production}
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://storage:8333
  S3_PUBLIC_URL: ${S3_PUBLIC_URL}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Chỉ mở cho máy này (để chạy Prisma/Nest ngoài Docker khi phát triển)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    # SeaweedFS: kho file chuẩn S3. Bucket ${S3_BUCKET} được api tạo khi khởi động.
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - storagedata:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"

  api:
    build: ./backend
    image: san7-backend:local
    restart: unless-stopped
    environment: *backend-env
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    # Cùng image với api: chạy processor BullMQ (sau này thêm ffmpeg)
    image: san7-backend:local
    restart: unless-stopped
    environment: *backend-env
    command: ["node", "dist/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-1.0}"
          memory: ${WORKER_MEMORY:-768M}

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_SITE: ${CADDY_SITE:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

  # Bật khi cần cho người ở xa thử: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - caddy

volumes:
  pgdata:
  redisdata:
  storagedata:
  caddydata:
  caddyconfig:
